name: One-time UTM passthrough fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/utm-pass-through.yml'
      - 'scripts/inject_utm.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject UTM forwarding into Hotmart links
        run: python3 scripts/inject_utm.py

      - name: Commit tracking fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix UTM passthrough to Hotmart checkout"
          git push
