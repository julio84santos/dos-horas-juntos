<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test de conexión | Dos Horas Juntos</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5efe7;color:#2b2b2b}.wrap{max-width:680px;margin:auto;min-height:100vh;padding:24px 18px}.brand{text-align:center;color:#c85a2f;font-family:Georgia,serif;font-size:22px}.progress{height:8px;background:#eadfd7;border-radius:10px;overflow:hidden;margin:25px 0}.bar{height:100%;background:#c85a2f;width:14%;transition:.3s}.card{background:white;border-radius:18px;padding:30px 24px;box-shadow:0 8px 30px #0001}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#c85a2f;font-weight:bold}h1,h2{font-family:Georgia,serif;line-height:1.15}h1{font-size:36px;color:#c85a2f}h2{font-size:28px}.sub{line-height:1.6;color:#555}.options{display:grid;gap:12px;margin-top:25px}.opt,.cta{border:1px solid #e2d4ca;background:#fff;padding:16px;border-radius:12px;font-size:16px;text-align:left;cursor:pointer}.opt:hover{border-color:#c85a2f;background:#fff8f4}.cta{background:#c85a2f;color:white;border:0;text-align:center;font-weight:bold;width:100%}.small{text-align:center;font-size:12px;color:#777;margin-top:14px}.spinner{width:48px;height:48px;border:5px solid #eee;border-top-color:#c85a2f;border-radius:50%;animation:s 1s linear infinite;margin:20px auto}@keyframes s{to{transform:rotate(360deg)}}.result{background:#edd5c6;border-radius:12px;padding:18px;margin:20px 0}.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.plan{border:2px solid #ddd;border-radius:14px;padding:18px}.best{border-color:#c85a2f;background:#fff8f4}.badge{font-size:11px;background:#c85a2f;color:white;padding:5px 8px;border-radius:12px}.price{font-size:32px;font-weight:bold;color:#c85a2f;margin:10px 0}@media(max-width:520px){h1{font-size:30px}.plans{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="brand">DOS HORAS JUNTOS</div><div class="progress"><div class="bar" id="bar"></div></div><section class="card" id="app"></section></main><script>const qs=[['¿A quién visitas habitualmente?',['A mi madre','A mi padre','A mi abuelo/a','A mi pareja','A otro familiar']],['¿Con qué frecuencia os veis?',['Varias veces por semana','Una vez por semana','Algunas veces al mes','Con menos frecuencia']],['Cuando estáis juntos, ¿te cuesta saber qué hacer o de qué hablar?',['Sí, mucho','A veces','Casi nunca']],['¿Qué situación te resulta más difícil?',['No sé de qué hablar','Repite las mismas cosas','Parece que no quiere participar','Me cuesta mantener su atención','Termino la visita con sensación de tristeza']],['¿Qué te gustaría sentir al terminar vuestra próxima visita?',['Más conexión','Más tranquilidad','Más alegría','Sentir que hemos aprovechado el tiempo juntos']]];let i=-1,a=[];const app=document.getElementById('app'),bar=document.getElementById('bar');function start(){i=0;render()}function render(){bar.style.width=((i+1)/(qs.length+1)*100)+'%';let q=qs[i];app.innerHTML='<div class="eyebrow">Pregunta '+(i+1)+' de '+qs.length+'</div><h2>'+q[0]+'</h2><div class="options">'+q[1].map((x,n)=>'<button class="opt" onclick="pick('+n+')">'+x+'</button>').join('')+'</div>'}function pick(n){a.push(qs[i][1][n]);i++;i<qs.length?render():load()}function load(){bar.style.width='92%';app.innerHTML='<div style="text-align:center;padding:30px 0"><div class="eyebrow">Preparando tu resultado</div><div class="spinner"></div><h2>Analizando vuestra rutina...</h2><p class="sub">Identificando formas sencillas de aprovechar mejor vuestro tiempo juntos.</p></div>';setTimeout(result,1700)}function result(){bar.style.width='100%';app.innerHTML='<div class="eyebrow">Tu resultado</div><h1>La relación no se ha acabado. Ha cambiado de forma.</h1><div class="result"><strong>No necesitas llenar cada silencio.</strong><p>Pequeñas actividades guiadas pueden ayudarte a crear momentos más naturales y recuperar la sensación de estar realmente juntos.</p></div><h2>Haz que vuestra próxima visita sea diferente</h2><p class="sub">Dos Horas Juntos reúne actividades y recursos imprimibles para que no tengas que improvisar.</p><div class="plans"><div class="plan"><strong>Esencial</strong><div class="price">5 €</div><small>Una forma sencilla de empezar.</small></div><div class="plan best"><span class="badge">MÁS ELEGIDO</span><h3>Completo</h3><div class="price">10 €</div><small>Más recursos para cada visita.</small></div></div><button class="cta" onclick="go()">QUIERO EMPEZAR</button><div class="small">Acceso digital · Úsalo a tu ritmo</div>'}function go(){let p=location.search;location.href='/'+p+'#planes'}app.innerHTML='<div class="eyebrow">Test de conexión</div><h1>¿Cómo son realmente vuestras visitas?</h1><p class="sub">Descubre en 2 minutos qué puede estar dificultando vuestra conexión y qué puedes hacer diferente en vuestra próxima visita.</p><button class="cta" onclick="start()">EMPEZAR EL TEST</button><div class="small">5 preguntas · Sin registros</div>';</script></body></html>
